name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            pkg-config \
            g++ \
            zip \
            zlib1g-dev \
            unzip \
            python3 \
            ca-certificates \
            clang-format-19 \
            cpplint \
            libeigen3-dev \
            libgtest-dev

      - name: Set up Bazel 9
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Code Format Check
        uses: jidicula/clang-format-action@v4.14.0
        with:
          clang-format-version: '19'
          check-path: '.'
          fallback-style: 'Google'

      - name: Code Lint
        uses: reviewdog/action-cpplint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          flags: '--extensions=h,hpp,c,cpp,cc,cu,hh,ipp --filter=-build/include_order,-whitespace/indent_namespace --recursive include'

      - name: Build (strict warnings)
        run: |
          bazel build //... \
            --copt=-Wall --copt=-Wextra --copt=-Wpedantic \
            --copt=-Wdouble-promotion --copt=-Werror

      - name: Test
        run: |
          bazel test //... \
            --copt=-Wall --copt=-Wextra --copt=-Wpedantic \
            --copt=-Wdouble-promotion --copt=-Werror

      - name: Configure and Build with CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build .
          ctest --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libeigen3-dev

      - name: Set up Bazel 9
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-san
          repository-cache: true

      - name: Test with ASAN + UBSAN
        run: |
          bazel test //... \
            --copt=-fsanitize=address,undefined \
            --copt=-fno-omit-frame-pointer \
            --linkopt=-fsanitize=address,undefined
